<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gesture OS V10</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#020305;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:9px 0 2px;
  font-size:25px;
  letter-spacing:2px;
}

#status{
  font-size:12px;
  opacity:.6;
}

#gesture{
  font-size:23px;
  margin:6px;
}

#action{
  min-height:25px;
  font-size:16px;
}

#controls{
  width:92%;
  max-width:500px;
  margin:7px auto;
  padding:9px;
  border:1px solid #444;
  border-radius:14px;
}

#sensitivity{
  width:70%;
}

#stage{
  position:relative;
  width:94%;
  max-width:700px;
  height:56vh;
  min-height:330px;
  margin:8px auto;
  border:1px solid #444;
  border-radius:22px;
  overflow:hidden;
  background:#080b10;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.45;
}

#cursor{
  position:absolute;
  width:28px;
  height:28px;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:none;
  z-index:20;
  box-shadow:0 0 14px white;
}

#cursorDot{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#launcher{
  position:absolute;
  width:82%;
  max-width:520px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:15px;
  border:1px solid #555;
  border-radius:20px;
  background:rgba(5,8,12,.92);
  backdrop-filter:blur(10px);
  z-index:5;
}

#launcherTitle{
  font-size:20px;
  margin-bottom:12px;
}

#apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.app{
  padding:17px 4px;
  border:1px solid #666;
  border-radius:14px;
  font-size:13px;
  transition:.12s;
}

.selected{
  border:2px solid white;
  transform:scale(1.07);
}

#window{
  position:absolute;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:82%;
  height:72%;
  background:rgba(8,10,15,.97);
  border:1px solid #777;
  border-radius:20px;
  z-index:10;
  overflow:hidden;
}

#windowHeader{
  height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #444;
}

#windowBody{
  height:calc(100% - 45px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
}

#windowIcon{
  font-size:50px;
}

#windowText{
  font-size:17px;
}

#windowHint{
  font-size:12px;
  opacity:.55;
}

#info{
  font-size:12px;
  opacity:.55;
  margin:7px;
}
</style>
</head>

<body>

<h1>GESTURE OS V10</h1>

<div id="status">
AI SPATIAL INTERFACE • GESTURE CONTROL
</div>

<div id="gesture">
Show your hand ✋
</div>

<div id="action">
Starting...
</div>

<div id="controls">

Sensitivity:

<input
  id="sensitivity"
  type="range"
  min="1"
  max="100"
  value="40">

<span id="sensValue">40</span>%

</div>

<div id="stage">

<video
  id="camera"
  autoplay
  playsinline>
</video>

<div id="cursor">
  <div id="cursorDot"></div>
</div>

<div id="launcher">

<div id="launcherTitle">
GESTURE OS
</div>

<div id="apps">

<div class="app">YouTube</div>
<div class="app">Google</div>
<div class="app">Music</div>

<div class="app">Browser</div>
<div class="app">Messages</div>
<div class="app">Settings</div>

</div>
</div>

<div id="window">

<div id="windowHeader">

<div id="windowTitle">
App
</div>

<div>
GESTURE OS
</div>

</div>

<div id="windowBody">

<div id="windowIcon">
🚀
</div>

<div id="windowText">
App Window
</div>

<div id="windowHint">
✊ Fist = Back
</div>

</div>

</div>

</div>

<div id="info">
☝️ Select • 🤏 Open • ✋ Home • ✊ Back • ✌️ Apps • 👈👉 Move • ⬆️⬇️ Scroll • Swipe
</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const cursor =
  document.getElementById("cursor");

const launcher =
  document.getElementById("launcher");

const windowBox =
  document.getElementById("window");

const gestureText =
  document.getElementById("gesture");

const actionText =
  document.getElementById("action");

const sensitivity =
  document.getElementById("sensitivity");

const sensValue =
  document.getElementById("sensValue");

const apps =
  [...document.querySelectorAll(".app")];


/* =====================================================
   STATE
===================================================== */

let selected = 0;

let smoothX = .5;
let smoothY = .5;

let pinchLocked = false;

let appOpen = false;

let lastAction = 0;


/* Movement state */

let lastX = null;
let lastY = null;

let movementLock = false;

let movementTimer = null;


/* =====================================================
   APP ICONS
===================================================== */

const icons = {

  YouTube:"▶️",

  Google:"🔎",

  Music:"🎵",

  Browser:"🌐",

  Messages:"💬",

  Settings:"⚙️"

};


/* =====================================================
   SENSITIVITY
===================================================== */

sensitivity.oninput = () => {

  sensValue.innerText =
    sensitivity.value;

};


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =====================================================
   HAND RECOGNITION
===================================================== */

function recognize(h){

  const s =
    Number(sensitivity.value);

  const pinchLimit =
    .035+(s/100)*.035;


  /* PINCH */

  if(
    distance(h[4],h[8])
    < pinchLimit
  ){

    return "PINCH";

  }


  const index =
    h[8].y<h[6].y;

  const middle =
    h[12].y<h[10].y;

  const ring =
    h[16].y<h[14].y;

  const pinky =
    h[20].y<h[18].y;


  /* PALM */

  if(
    index &&
    middle &&
    ring &&
    pinky
  ){

    return "PALM";

  }


  /* FIST */

  if(
    !index &&
    !middle &&
    !ring &&
    !pinky
  ){

    return "FIST";

  }


  /* TWO FINGERS */

  if(
    index &&
    middle &&
    !ring &&
    !pinky
  ){

    return "TWO";

  }


  /* POINT */

  if(
    index &&
    !middle &&
    !ring &&
    !pinky
  ){

    return "POINT";

  }


  return "HAND";

}


/* =====================================================
   APP HIGHLIGHT
===================================================== */

function highlight(){

  apps.forEach(
    (app,i)=>{

      app.classList.toggle(
        "selected",
        i===selected
      );

    }
  );

}


/* =====================================================
   OPEN APP
===================================================== */

function openApp(){

  const name =
    apps[selected].innerText;


  /* YouTube */

  if(name==="YouTube"){

    actionText.innerText =
      "🚀 Opening YouTube...";

    window.open(
      "https://www.youtube.com/",
      "_blank"
    );

    return;

  }


  /* Google */

  if(name==="Google"){

    actionText.innerText =
      "🚀 Opening Google...";

    window.open(
      "https://www.google.com/",
      "_blank"
    );

    return;

  }


  /* Other apps */

  launcher.style.display =
    "none";

  windowBox.style.display =
    "block";


  document.getElementById(
    "windowTitle"
  ).innerText=name;


  document.getElementById(
    "windowText"
  ).innerText=
    name+" Window";


  document.getElementById(
    "windowIcon"
  ).innerText=
    icons[name];


  actionText.innerText =
    "🤏 OPENED → "+name;


  appOpen=true;

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  windowBox.style.display =
    "none";

  launcher.style.display =
    "block";

  appOpen=false;

  cursor.style.display =
    "none";

  actionText.innerText =
    "✋ HOME";

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  if(appOpen){

    goHome();

    return;

  }

  actionText.innerText =
    "✊ BACK";

}


/* =====================================================
   CURSOR
===================================================== */

function moveCursor(hand){

  const x =
    1-hand[8].x;

  const y =
    hand[8].y;


  const s =
    Number(sensitivity.value);


  const smoothing =
    .18+(s/100)*.22;


  smoothX +=
    (x-smoothX)*smoothing;

  smoothY +=
    (y-smoothY)*smoothing;


  cursor.style.display =
    "block";


  cursor.style.left =
    (smoothX*100)+"%";


  cursor.style.top =
    (smoothY*100)+"%";


  if(appOpen)
    return;


  const column =
    Math.min(
      2,
      Math.max(
        0,
        Math.floor(smoothX*3)
      )
    );


  const row =
    Math.min(
      1,
      Math.max(
        0,
        Math.floor(smoothY*2)
      )
    );


  const newSelected =
    row*3+column;


  if(
    newSelected !== selected
  ){

    selected =
      newSelected;

    highlight();


    actionText.innerText =
      "☝️ "+
      apps[selected].innerText;

  }

}


/* =====================================================
   MOVEMENT DETECTOR
===================================================== */

function detectMovement(hand){

  const x =
    1-hand[0].x;

  const y =
    hand[0].y;


  if(
    lastX===null ||
    lastY===null
  ){

    lastX=x;
    lastY=y;

    return null;

  }


  const dx =
    x-lastX;

  const dy =
    y-lastY;


  lastX=x;
  lastY=y;


  const s =
    Number(sensitivity.value);


  const moveThreshold =
    .025+
    (100-s)*.00035;


  const swipeThreshold =
    .10+
    (100-s)*.0007;


  if(movementLock)
    return null;


  /* SWIPE HORIZONTAL */

  if(
    Math.abs(dx)>swipeThreshold &&
    Math.abs(dx)>Math.abs(dy)
  ){

    movementLock=true;

    clearTimeout(
      movementTimer
    );

    movementTimer =
      setTimeout(
        ()=>{
          movementLock=false;
        },
        450
      );


    return dx>0
      ? "SWIPE_RIGHT"
      : "SWIPE_LEFT";

  }


  /* SWIPE VERTICAL */

  if(
    Math.abs(dy)>swipeThreshold &&
    Math.abs(dy)>Math.abs(dx)
  ){

    movementLock=true;

    clearTimeout(
      movementTimer
    );

    movementTimer =
      setTimeout(
        ()=>{
          movementLock=false;
        },
        450
      );


    return dy<0
      ? "SWIPE_UP"
      : "SWIPE_DOWN";

  }


  /* MOVE HORIZONTAL */

  if(
    Math.abs(dx)>moveThreshold &&
    Math.abs(dx)>Math.abs(dy)*1.25
  ){

    return dx>0
      ? "MOVE_RIGHT"
      : "MOVE_LEFT";

  }


  /* MOVE VERTICAL */

  if(
    Math.abs(dy)>moveThreshold &&
    Math.abs(dy)>Math.abs(dx)*1.25
  ){

    return dy<0
      ? "MOVE_UP"
      : "MOVE_DOWN";

  }


  return null;

}


/* =====================================================
   MOVEMENT ACTIONS
===================================================== */

function executeMovement(action){

  if(!action)
    return;


  const now =
    Date.now();


  if(
    now-lastAction<250
  )
    return;


  lastAction =
    now;


  switch(action){


    case "MOVE_LEFT":

      actionText.innerText =
        "👈 MOVE LEFT → BACK";

      goBack();

      break;


    case "MOVE_RIGHT":

      actionText.innerText =
        "👉 MOVE RIGHT → RECENTS";

      /*
        Android bridge:
        GLOBAL_ACTION_RECENTS
      */

      break;


    case "MOVE_UP":

      actionText.innerText =
        "👆 MOVE UP → SCROLL UP";

      window.scrollBy({
        top:-350,
        behavior:"smooth"
      });

      break;


    case "MOVE_DOWN":

      actionText.innerText =
        "👇 MOVE DOWN → SCROLL DOWN";

      window.scrollBy({
        top:350,
        behavior:"smooth"
      });

      break;


    case "SWIPE_LEFT":

      actionText.innerText =
        "⬅️ SWIPE LEFT → PREVIOUS";

      selected =
        (selected-1+apps.length)
        %apps.length;

      highlight();

      break;


    case "SWIPE_RIGHT":

      actionText.innerText =
        "➡️ SWIPE RIGHT → NEXT";

      selected =
        (selected+1)
        %apps.length;

      highlight();

      break;


    case "SWIPE_UP":

      actionText.innerText =
        "⬆️ SWIPE UP → NEXT SHORT";

      break;


    case "SWIPE_DOWN":

      actionText.innerText =
        "⬇️ SWIPE DOWN → PREVIOUS SHORT";

      break;

  }

}


/* =====================================================
   MAIN GESTURE ENGINE
===================================================== */

function executeGesture(
  gesture,
  hand
){

  const now =
    Date.now();


  const s =
    Number(sensitivity.value);


  /* PINCH */

  if(
    gesture==="PINCH"
  ){

    if(!pinchLocked){

      pinchLocked=true;

      openApp();

      lastAction=now;

    }

    return;

  }


  /* RELEASE PINCH */

  if(pinchLocked){

    const d =
      distance(
        hand[4],
        hand[8]
      );


    const releaseLimit =
      .055+
      (s/100)*.035;


    if(
      d>releaseLimit
    ){

      pinchLocked=false;

    }

    return;

  }


  /* POINT */

  if(
    gesture==="POINT"
  ){

    moveCursor(hand);

  }


  /* PALM */

  if(
    gesture==="PALM"
  ){

    if(
      now-lastAction>500
    ){

      goHome();

      lastAction=now;

    }

  }


  /* FIST */

  if(
    gesture==="FIST"
  ){

    if(
      now-lastAction>500
    ){

      goBack();

      lastAction=now;

    }

  }


  /* TWO */

  if(
    gesture==="TWO"
  ){

    if(
      now-lastAction>700
    ){

      actionText.innerText =
        "✌️ APP WORKSPACE";

      lastAction=now;

    }

  }


  /* MOVEMENT */

  const movement =
    detectMovement(hand);


  executeMovement(
    movement
  );

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
  new Hands({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


hands.onResults(
  results=>{

    if(
      !results.multiHandLandmarks ||
      !results.multiHandLandmarks.length
    ){

      gestureText.innerText =
        "Show your hand ✋";

      cursor.style.display =
        "none";

      pinchLocked=false;

      lastX=null;
      lastY=null;

      return;

    }


    const hand =
      results.multiHandLandmarks[0];


    const gesture =
      recognize(hand);


    const names={

      POINT:"☝️ POINT",

      PINCH:"🤏 PINCH",

      PALM:"✋ OPEN PALM",

      FIST:"✊ FIST",

      TWO:"✌️ TWO FINGERS",

      HAND:"✋ HAND"

    };


    gestureText.innerText =
      names[gesture];


    executeGesture(
      gesture,
      hand
    );

  }
);


/* =====================================================
   CAMERA
===================================================== */

async function start(){

  try{

    const stream =
      await navigator
      .mediaDevices
      .getUserMedia({

        video:true,

        audio:false

      });


    video.srcObject =
      stream;


    const camera =
      new Camera(
        video,
        {

          onFrame:async()=>{

            await hands.send({
              image:video
            });

          },

          width:640,

          height:480

        }
      );


    camera.start();


    actionText.innerText =
      "Gesture OS V10 ready 🚀";


  }catch(error){

    actionText.innerText =
      "Camera error: "+
      error.message;

  }

}


/* =====================================================
   START
===================================================== */

highlight();

start();

</script>

</body>
  </html>
