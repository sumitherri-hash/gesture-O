<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture OS V6</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow-x:hidden;
}

h1{
  margin:10px 0 2px;
  font-size:26px;
}

#status{
  font-size:13px;
  opacity:.6;
}

#gesture{
  font-size:25px;
  margin:8px;
}

#action{
  font-size:18px;
  min-height:28px;
}

#settings{
  width:92%;
  max-width:500px;
  margin:10px auto;
  padding:12px;
  border:1px solid #444;
  border-radius:15px;
}

#sensitivity{
  width:75%;
}

video{
  width:94%;
  max-width:600px;
  border-radius:20px;
  transform:scaleX(-1);
  border:1px solid #333;
}

#apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  width:94%;
  margin:15px auto;
}

.app{
  height:75px;
  border:2px solid #777;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:.12s;
}

.selected{
  border:3px solid white;
  transform:scale(1.06);
}

#info{
  font-size:13px;
  opacity:.55;
  margin:12px;
}
</style>
</head>

<body>

<h1>GESTURE OS V6</h1>

<div id="status">
AI SPATIAL INTERFACE • FAST SELECT
</div>

<div id="gesture">
Show your hand ✋
</div>

<div id="action">
Starting...
</div>

<div id="settings">
Sensitivity:
<input
  id="sensitivity"
  type="range"
  min="1"
  max="100"
  value="40">
<span id="sensValue">40</span>%
</div>

<video id="camera" autoplay playsinline></video>

<div id="apps">
  <div class="app">YouTube</div>
  <div class="app">Camera</div>
  <div class="app">Music</div>
  <div class="app">Browser</div>
  <div class="app">Messages</div>
  <div class="app">Settings</div>
</div>

<div id="info">
☝️ Select • 🤏 Activate • ✋ Home • ✊ Back • ✌️ Workspace
</div>

<script>

const video=document.getElementById("camera");
const gestureText=document.getElementById("gesture");
const actionText=document.getElementById("action");
const sensitivity=document.getElementById("sensitivity");
const sensValue=document.getElementById("sensValue");

const apps=[...document.querySelectorAll(".app")];

let selected=0;

let currentGesture="";
let gestureStart=0;
let lastAction=0;

/* PINCH LOCK */
let pinchLocked=false;


/* Sensitivity */

sensitivity.oninput=()=>{
  sensValue.innerText=sensitivity.value;
};


/* Distance */

function distance(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


/* Gesture recognition */

function recognize(h){

  const s=Number(sensitivity.value);

  /*
    Pinch threshold.
    Lower sensitivity = smaller threshold.
    Higher sensitivity = larger threshold.
  */

  const pinchLimit=
    0.035+(s/100)*0.035;

  const pinch=
    distance(h[4],h[8])<pinchLimit;


  /*
    PINCH HAS ABSOLUTE PRIORITY.
  */

  if(pinch){
    return "PINCH";
  }


  const index=h[8].y<h[6].y;
  const middle=h[12].y<h[10].y;
  const ring=h[16].y<h[14].y;
  const pinky=h[20].y<h[18].y;


  if(index&&middle&&ring&&pinky)
    return "PALM";


  if(!index&&!middle&&!ring&&!pinky)
    return "FIST";


  if(index&&middle&&!ring&&!pinky)
    return "TWO";


  if(index&&!middle&&!ring&&!pinky)
    return "POINT";


  return "HAND";
}


/* Highlight app */

function selectApp(){

  apps.forEach((app,i)=>{

    app.classList.toggle(
      "selected",
      i===selected
    );

  });

}


/* Execute gesture */

function executeGesture(gesture,hand){

  const now=Date.now();
  const s=Number(sensitivity.value);


  /*
    PINCH LOCK SYSTEM

    When pinch starts, it remains
    PINCH until the fingers separate.
  */

  if(gesture==="PINCH"){

    if(!pinchLocked){

      pinchLocked=true;

      actionText.innerText=
        "🤏 OPEN → "+
        apps[selected].innerText;

      lastAction=now;
    }

    currentGesture="PINCH";

    return;
  }


  /*
    Don't allow another gesture
    to replace an active pinch.
  */

  if(pinchLocked){

    currentGesture="PINCH";

    return;
  }


  /*
    Faster POINT response.
  */

  if(gesture==="POINT"){

    /*
      Small hold instead of long hold.
      Higher sensitivity = faster.
    */

    const requiredHold=
      70-(s*0.35);


    if(gesture!==currentGesture){

      currentGesture="POINT";
      gestureStart=now;

      return;
    }


    if(now-gestureStart<requiredHold)
      return;


    /*
      Fast pointer calculation.
    */

    const x=1-hand[8].x;
    const y=hand[8].y;


    const column=Math.min(
      2,
      Math.max(
        0,
        Math.floor(x*3)
      )
    );


    const row=Math.min(
      1,
      Math.max(
        0,
        Math.floor(y*2)
      )
    );


    const newSelected=
      row*3+column;


    if(newSelected!==selected){

      selected=newSelected;

      selectApp();

      actionText.innerText=
        "☝️ Selected: "+
        apps[selected].innerText;
    }


    return;
  }


  /*
    Other gestures remain stable.
  */

  const requiredHold=
    150-(s*0.5);


  if(gesture!==currentGesture){

    currentGesture=gesture;
    gestureStart=now;

    return;
  }


  if(now-gestureStart<requiredHold)
    return;


  const cooldown=
    700-(s*2);


  if(now-lastAction<cooldown)
    return;


  lastAction=now;


  if(gesture==="PALM"){

    actionText.innerText=
      "✋ HOME";
  }


  else if(gesture==="FIST"){

    actionText.innerText=
      "✊ BACK";
  }


  else if(gesture==="TWO"){

    actionText.innerText=
      "✌️ SWITCH WORKSPACE";
  }

}


/* MediaPipe */

const hands=new Hands({

  locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


hands.onResults(results=>{

  if(
    !results.multiHandLandmarks ||
    !results.multiHandLandmarks.length
  ){

    gestureText.innerText=
      "Show your hand ✋";

    /*
      Release pinch lock when
      hand disappears.
    */

    pinchLocked=false;
    currentGesture="";

    return;
  }


  const hand=
    results.multiHandLandmarks[0];


  const gesture=
    recognize(hand);


  const names={

    POINT:"☝️ POINT",

    PINCH:"🤏 PINCH",

    PALM:"✋ OPEN PALM",

    FIST:"✊ FIST",

    TWO:"✌️ TWO FINGERS",

    HAND:"✋ HAND"

  };


  gestureText.innerText=
    names[gesture];


  executeGesture(
    gesture,
    hand
  );

});


/* Start camera */

async function start(){

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({

        video:true,
        audio:false

      });


    video.srcObject=stream;


    const camera=
      new Camera(video,{

        onFrame:async()=>{

          await hands.send({
            image:video
          });

        },

        width:640,
        height:480

      });


    camera.start();


    actionText.innerText=
      "Gesture OS V6 ready 🚀";


  }catch(error){

    actionText.innerText=
      "Camera error: "+
      error.message;

  }

}


selectApp();
start();

</script>

</body>
  </html>
