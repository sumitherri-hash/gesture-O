<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture OS V4</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}

h1{margin:10px 0 2px}

#status{
 font-size:13px;
 opacity:.65;
}

#gesture{
 font-size:25px;
 margin:8px;
}

#action{
 font-size:18px;
 min-height:25px;
}

#settings{
 margin:10px auto;
 width:92%;
 max-width:500px;
 padding:12px;
 border:1px solid #444;
 border-radius:15px;
}

input{
 width:80%;
}

video{
 width:94%;
 max-width:600px;
 border-radius:20px;
 transform:scaleX(-1);
}

#apps{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 width:94%;
 margin:15px auto;
}

.app{
 height:75px;
 border:2px solid #777;
 border-radius:18px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:14px;
 transition:.15s;
}

.selected{
 border:3px solid white;
 transform:scale(1.06);
}

#info{
 font-size:13px;
 opacity:.6;
 margin:10px;
}
</style>
</head>

<body>

<h1>GESTURE OS</h1>
<div id="status">AI SPATIAL INTERFACE</div>

<div id="gesture">Show your hand ✋</div>
<div id="action">Starting...</div>

<div id="settings">
 Sensitivity:
 <input id="sensitivity" type="range"
        min="1" max="100" value="60">
 <span id="sensValue">60</span>%
</div>

<video id="camera" autoplay playsinline></video>

<div id="apps">
 <div class="app">YouTube</div>
 <div class="app">Camera</div>
 <div class="app">Music</div>
 <div class="app">Browser</div>
 <div class="app">Messages</div>
 <div class="app">Settings</div>
</div>

<div id="info">
☝️ Select • 🤏 Activate • ✋ Home • ✊ Back • ✌️ Workspace
</div>

<script>

const video=document.getElementById("camera");
const gestureText=document.getElementById("gesture");
const actionText=document.getElementById("action");

const sensitivity=document.getElementById("sensitivity");
const sensValue=document.getElementById("sensValue");

const apps=[...document.querySelectorAll(".app")];

let selected=0;
let lastGesture="";
let lastTime=0;

sensitivity.oninput=()=>{
 sensValue.innerText=sensitivity.value;
};

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function recognize(h){

 const s=Number(sensitivity.value);

 /*
   Higher sensitivity = easier gesture detection.
   Lower sensitivity = requires clearer gestures.
 */

 const pinchLimit=0.035+(s/100)*0.055;

 const index=h[8].y<h[6].y;
 const middle=h[12].y<h[10].y;
 const ring=h[16].y<h[14].y;
 const pinky=h[20].y<h[18].y;

 const pinch=distance(h[4],h[8])<pinchLimit;

 if(pinch)return"PINCH";

 if(index&&middle&&ring&&pinky)
   return"PALM";

 if(!index&&!middle&&!ring&&!pinky)
   return"FIST";

 if(index&&middle&&!ring&&!pinky)
   return"TWO";

 if(index&&!middle&&!ring&&!pinky)
   return"POINT";

 return"HAND";
}

function selectApp(){

 apps.forEach((app,i)=>{
   app.classList.toggle("selected",i===selected);
 });

}

function perform(g){

 const now=Date.now();

 /*
   Sensitivity also controls cooldown.
 */

 const cooldown=1200-
   Number(sensitivity.value)*5;

 if(now-lastTime<cooldown && g===lastGesture)
   return;

 lastGesture=g;
 lastTime=now;

 if(g==="POINT"){

   selected=(selected+1)%apps.length;

   selectApp();

   actionText.innerText=
     "☝️ Selected: "+apps[selected].innerText;
 }

 else if(g==="PINCH"){

   actionText.innerText=
     "🤏 Opening: "+apps[selected].innerText;
 }

 else if(g==="PALM"){

   actionText.innerText="✋ HOME";
 }

 else if(g==="FIST"){

   actionText.innerText="✊ BACK";
 }

 else if(g==="TWO"){

   actionText.innerText=
     "✌️ SWITCH WORKSPACE";
 }

}

const hands=new Hands({

 locateFile:file=>
 `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});

hands.setOptions({

 maxNumHands:1,
 modelComplexity:1,
 minDetectionConfidence:.6,
 minTrackingConfidence:.6

});

hands.onResults(results=>{

 if(!results.multiHandLandmarks?.length){

   gestureText.innerText="Show your hand ✋";
   return;
 }

 const hand=results.multiHandLandmarks[0];

 const g=recognize(hand);

 const names={
   POINT:"☝️ POINT",
   PINCH:"🤏 PINCH",
   PALM:"✋ OPEN PALM",
   FIST:"✊ FIST",
   TWO:"✌️ TWO FINGERS",
   HAND:"✋ HAND"
 };

 gestureText.innerText=names[g];

 perform(g);

});

async function start(){

 try{

   const stream=
     await navigator.mediaDevices.getUserMedia({
       video:true,
       audio:false
     });

   video.srcObject=stream;

   const camera=new Camera(video,{

     onFrame:async()=>{
       await hands.send({image:video});
     },

     width:640,
     height:480

   });

   camera.start();

   actionText.innerText=
     "Gesture OS ready 🚀";

 }catch(error){

   actionText.innerText=
     "Camera error: "+error.message;

 }

}

selectApp();
start();

</script>

</body>
</html>
