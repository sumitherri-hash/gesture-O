<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture OS V3</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:10px 0 2px;
  font-size:25px;
}

#status{
  font-size:14px;
  opacity:.7;
}

#gesture{
  font-size:24px;
  margin:8px;
}

#action{
  font-size:18px;
  min-height:25px;
}

#workspace{
  position:relative;
  width:94%;
  height:45vh;
  margin:10px auto;
  border:1px solid #444;
  border-radius:25px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

#cursor{
  position:absolute;
  width:25px;
  height:25px;
  border:3px solid white;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  display:none;
}

#apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  width:94%;
  margin:auto;
}

.app{
  height:75px;
  border:2px solid #777;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:.15s;
}

.selected{
  border:3px solid white;
  transform:scale(1.05);
}

#info{
  margin-top:10px;
  font-size:13px;
  opacity:.6;
}
</style>
</head>

<body>

<h1>GESTURE OS</h1>
<div id="status">AI SPATIAL INTERFACE</div>

<div id="gesture">Show your hand ✋</div>
<div id="action">Starting...</div>

<div id="workspace">

  <video id="camera" autoplay playsinline></video>

  <div id="cursor"></div>

</div>

<div id="apps">

  <div class="app">YouTube</div>
  <div class="app">Camera</div>
  <div class="app">Music</div>
  <div class="app">Browser</div>
  <div class="app">Messages</div>
  <div class="app">Settings</div>

</div>

<div id="info">
☝️ Select • 🤏 Activate • ✋ Home • ✊ Back • ✌️ Workspace
</div>

<script>

const video=document.getElementById("camera");
const gestureText=document.getElementById("gesture");
const actionText=document.getElementById("action");
const cursor=document.getElementById("cursor");
const workspace=document.getElementById("workspace");

const apps=[...document.querySelectorAll(".app")];

let selected=0;
let lastGesture="";
let lastTime=0;

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function recognize(h){

  const index=h[8].y<h[6].y;
  const middle=h[12].y<h[10].y;
  const ring=h[16].y<h[14].y;
  const pinky=h[20].y<h[18].y;

  const pinch=distance(h[4],h[8])<0.06;

  if(pinch)return"PINCH";

  if(index&&middle&&ring&&pinky)
    return"PALM";

  if(!index&&!middle&&!ring&&!pinky)
    return"FIST";

  if(index&&middle&&!ring&&!pinky)
    return"TWO";

  if(index&&!middle&&!ring&&!pinky)
    return"POINT";

  return"HAND";
}

function selectApp(){

  apps.forEach((app,i)=>{
    app.classList.toggle("selected",i===selected);
  });

}

function action(g,hand){

  const now=Date.now();

  if(now-lastTime<700 && g===lastGesture)
    return;

  lastGesture=g;
  lastTime=now;

  if(g==="POINT"){

    /*
      Move virtual cursor using
      the index fingertip.
    */

    const x=1-hand[8].x;
    const y=hand[8].y;

    cursor.style.display="block";
    cursor.style.left=(x*100)+"%";
    cursor.style.top=(y*100)+"%";

    selected=Math.min(
      apps.length-1,
      Math.max(0,
        Math.floor(x*3)+Math.floor(y*2)*3
      )
    );

    selectApp();

    actionText.innerText=
      "☝️ "+apps[selected].innerText;

  }

  else if(g==="PINCH"){

    actionText.innerText=
      "🤏 OPEN → "+apps[selected].innerText;

  }

  else if(g==="PALM"){

    actionText.innerText=
      "✋ HOME";

    cursor.style.display="none";

  }

  else if(g==="FIST"){

    actionText.innerText=
      "✊ BACK";

  }

  else if(g==="TWO"){

    actionText.innerText=
      "✌️ SWITCH WORKSPACE";

  }

}

const hands=new Hands({

  locateFile:file=>
  `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});

hands.setOptions({

  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:.6,
  minTrackingConfidence:.6

});

hands.onResults(results=>{

  if(!results.multiHandLandmarks?.length){

    gestureText.innerText="Show your hand ✋";
    cursor.style.display="none";
    return;

  }

  const hand=results.multiHandLandmarks[0];

  const g=recognize(hand);

  const names={
    POINT:"☝️ POINT",
    PINCH:"🤏 PINCH",
    PALM:"✋ OPEN PALM",
    FIST:"✊ FIST",
    TWO:"✌️ TWO FINGERS",
    HAND:"✋ HAND"
  };

  gestureText.innerText=names[g];

  action(g,hand);

});

async function start(){

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
      });

    video.srcObject=stream;

    const camera=new Camera(video,{

      onFrame:async()=>{
        await hands.send({image:video});
      },

      width:640,
      height:480

    });

    camera.start();

    actionText.innerText=
      "Gesture OS ready 🚀";

  }catch(error){

    actionText.innerText=
      "Camera error";

  }

}

selectApp();
start();

</script>

</body>
</html>
