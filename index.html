<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture OS V7</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#030507;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow-x:hidden;
}

h1{
  margin:10px 0 2px;
  font-size:26px;
  letter-spacing:2px;
}

#status{
  font-size:12px;
  opacity:.6;
}

#gesture{
  font-size:24px;
  margin:7px;
}

#action{
  min-height:26px;
  font-size:17px;
}

#controls{
  width:92%;
  max-width:500px;
  margin:8px auto;
  padding:10px;
  border:1px solid #444;
  border-radius:15px;
  background:#0a0d12;
}

#sensitivity{
  width:70%;
}

#stage{
  position:relative;
  width:94%;
  max-width:650px;
  height:48vh;
  min-height:300px;
  margin:10px auto;
  border:1px solid #444;
  border-radius:24px;
  overflow:hidden;
  background:#080b10;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.72;
}

#cursor{
  position:absolute;
  width:28px;
  height:28px;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:none;
  box-shadow:0 0 15px white;
}

#cursorDot{
  position:absolute;
  width:7px;
  height:7px;
  background:white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#panel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:80%;
  padding:15px;
  border:1px solid #555;
  border-radius:20px;
  background:rgba(5,8,12,.88);
  backdrop-filter:blur(8px);
}

#panelTitle{
  font-size:20px;
  margin-bottom:12px;
}

#miniApps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.mini{
  padding:15px 5px;
  border:1px solid #666;
  border-radius:14px;
  font-size:13px;
  transition:.1s;
}

.hover{
  border:2px solid white;
  transform:scale(1.08);
}

#info{
  font-size:12px;
  opacity:.55;
  margin:10px;
}
</style>
</head>

<body>

<h1>GESTURE OS V7</h1>

<div id="status">
AI SPATIAL INTERFACE • VIRTUAL CURSOR
</div>

<div id="gesture">
Show your hand ✋
</div>

<div id="action">
Starting...
</div>

<div id="controls">

Sensitivity:
<input
  id="sensitivity"
  type="range"
  min="1"
  max="100"
  value="40">

<span id="sensValue">40</span>%

</div>

<div id="stage">

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="cursor">
    <div id="cursorDot"></div>
  </div>

  <div id="panel">

    <div id="panelTitle">
      GESTURE OS
    </div>

    <div id="miniApps">

      <div class="mini">YouTube</div>
      <div class="mini">Camera</div>
      <div class="mini">Music</div>

      <div class="mini">Browser</div>
      <div class="mini">Messages</div>
      <div class="mini">Settings</div>

    </div>

  </div>

</div>

<div id="info">
☝️ Move • 🤏 Select • ✋ Home • ✊ Back • ✌️ Workspace
</div>

<script>

const video=document.getElementById("camera");
const stage=document.getElementById("stage");
const cursor=document.getElementById("cursor");

const gestureText=document.getElementById("gesture");
const actionText=document.getElementById("action");

const sensitivity=document.getElementById("sensitivity");
const sensValue=document.getElementById("sensValue");

const miniApps=[
  ...document.querySelectorAll(".mini")
];

let currentGesture="";
let pinchLocked=false;

let smoothX=.5;
let smoothY=.5;

let selected=0;
let lastAction=0;

let cursorVisible=false;


/* Sensitivity */

sensitivity.oninput=()=>{

  sensValue.innerText=
    sensitivity.value;

};


/* Distance */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* Gesture recognition */

function recognize(h){

  const s=
    Number(sensitivity.value);

  const pinchLimit=
    .035+(s/100)*.035;

  const pinch=
    distance(h[4],h[8])
    <pinchLimit;

  /*
    PINCH FIRST.
  */

  if(pinch)
    return"PINCH";


  const index=
    h[8].y<h[6].y;

  const middle=
    h[12].y<h[10].y;

  const ring=
    h[16].y<h[14].y;

  const pinky=
    h[20].y<h[18].y;


  if(
    index&&
    middle&&
    ring&&
    pinky
  )
    return"PALM";


  if(
    !index&&
    !middle&&
    !ring&&
    !pinky
  )
    return"FIST";


  if(
    index&&
    middle&&
    !ring&&
    !pinky
  )
    return"TWO";


  if(
    index&&
    !middle&&
    !ring&&
    !pinky
  )
    return"POINT";


  return"HAND";
}


/* Highlight mini app */

function highlightApp(index){

  miniApps.forEach(
    (app,i)=>{

      app.classList.toggle(
        "hover",
        i===index
      );

    }
  );

}


/* Virtual cursor */

function moveCursor(hand){

  /*
    Mirror the X position because
    the camera is mirrored.
  */

  const targetX=
    1-hand[8].x;

  const targetY=
    hand[8].y;


  /*
    Higher sensitivity =
    faster cursor.
  */

  const s=
    Number(sensitivity.value);

  const smoothing=
    .18+(s/100)*.22;


  smoothX+=
    (targetX-smoothX)*
    smoothing;

  smoothY+=
    (targetY-smoothY)*
    smoothing;


  cursor.style.display="block";

  cursor.style.left=
    (smoothX*100)+"%";

  cursor.style.top=
    (smoothY*100)+"%";

  cursorVisible=true;


  /*
    Convert cursor position
    into the 3x2 launcher grid.
  */

  const column=
    Math.min(
      2,
      Math.max(
        0,
        Math.floor(smoothX*3)
      )
    );


  const row=
    Math.min(
      1,
      Math.max(
        0,
        Math.floor(smoothY*2)
      )
    );


  const index=
    row*3+column;


  if(index!==selected){

    selected=index;

    highlightApp(selected);

    actionText.innerText=
      "☝️ "+
      miniApps[selected].innerText;
  }

}


/* Gesture actions */

function executeGesture(
  gesture,
  hand
){

  const now=
    Date.now();

  const s=
    Number(sensitivity.value);


  /*
    PINCH LOCK
  */

  if(gesture==="PINCH"){

    if(!pinchLocked){

      pinchLocked=true;

      actionText.innerText=
        "🤏 SELECT → "+
        miniApps[selected].innerText;

      lastAction=now;
    }

    currentGesture="PINCH";

    return;
  }


  /*
    While pinch is held,
    ignore other gestures.
  */

  if(pinchLocked){

    /*
      Release lock only after
      fingers are no longer pinching.
    */

    const pinchDistance=
      distance(
        hand[4],
        hand[8]
      );

    const releaseLimit=
      .055+(s/100)*.035;

    if(
      pinchDistance>
      releaseLimit
    ){

      pinchLocked=false;
      currentGesture="";
    }

    return;
  }


  /*
    POINT = CURSOR CONTROL
  */

  if(gesture==="POINT"){

    moveCursor(hand);

    return;
  }


  /*
    Other gestures
  */

  const cooldown=
    650-(s*2);


  if(now-lastAction<cooldown)
    return;


  if(gesture!==currentGesture){

    currentGesture=
      gesture;

    return;
  }


  lastAction=now;


  if(gesture==="PALM"){

    actionText.innerText=
      "✋ HOME";

    cursor.style.display="none";

  }


  else if(gesture==="FIST"){

    actionText.innerText=
      "✊ BACK";
  }


  else if(gesture==="TWO"){

    actionText.innerText=
      "✌️ SWITCH WORKSPACE";
  }

}


/* MediaPipe */

const hands=
  new Hands({

    locateFile:file=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


hands.onResults(results=>{

  if(
    !results.multiHandLandmarks ||
    !results.multiHandLandmarks.length
  ){

    gestureText.innerText=
      "Show your hand ✋";

    cursor.style.display="none";

    pinchLocked=false;
    currentGesture="";

    return;
  }


  const hand=
    results.multiHandLandmarks[0];


  const gesture=
    recognize(hand);


  const names={

    POINT:"☝️ POINT",

    PINCH:"🤏 PINCH",

    PALM:"✋ OPEN PALM",

    FIST:"✊ FIST",

    TWO:"✌️ TWO FINGERS",

    HAND:"✋ HAND"

  };


  gestureText.innerText=
    names[gesture];


  executeGesture(
    gesture,
    hand
  );

});


/* Start camera */

async function start(){

  try{

    const stream=
      await navigator.mediaDevices
      .getUserMedia({

        video:true,
        audio:false

      });


    video.srcObject=
      stream;


    const camera=
      new Camera(
        video,
        {

          onFrame:async()=>{

            await hands.send({
              image:video
            });

          },

          width:640,
          height:480

        }
      );


    camera.start();


    actionText.innerText=
      "Gesture OS V7 ready 🚀";


  }catch(error){

    actionText.innerText=
      "Camera error: "+
      error.message;

  }

}


highlightApp(0);

start();

</script>

</body>
  </html>
