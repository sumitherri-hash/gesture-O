<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture OS V8</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#020305;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:9px 0 2px;
  font-size:25px;
  letter-spacing:2px;
}

#status{
  font-size:12px;
  opacity:.6;
}

#gesture{
  font-size:23px;
  margin:6px;
}

#action{
  min-height:25px;
  font-size:16px;
}

#controls{
  width:92%;
  max-width:500px;
  margin:7px auto;
  padding:9px;
  border:1px solid #444;
  border-radius:14px;
}

#sensitivity{
  width:70%;
}

#stage{
  position:relative;
  width:94%;
  max-width:700px;
  height:56vh;
  min-height:330px;
  margin:8px auto;
  border:1px solid #444;
  border-radius:22px;
  overflow:hidden;
  background:#080b10;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.48;
}

#cursor{
  position:absolute;
  width:27px;
  height:27px;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:none;
  z-index:20;
  box-shadow:0 0 14px white;
}

#cursorDot{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#launcher{
  position:absolute;
  width:82%;
  max-width:520px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:15px;
  border:1px solid #555;
  border-radius:20px;
  background:rgba(5,8,12,.9);
  backdrop-filter:blur(10px);
  z-index:5;
}

#launcherTitle{
  font-size:20px;
  margin-bottom:12px;
}

#apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.app{
  padding:17px 4px;
  border:1px solid #666;
  border-radius:14px;
  font-size:13px;
  transition:.12s;
}

.selected{
  border:2px solid white;
  transform:scale(1.07);
}

#window{
  position:absolute;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:82%;
  height:72%;
  background:rgba(8,10,15,.96);
  border:1px solid #777;
  border-radius:20px;
  z-index:10;
  overflow:hidden;
}

#windowHeader{
  height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #444;
}

#windowTitle{
  font-size:16px;
}

#windowBody{
  height:calc(100% - 45px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
}

#windowIcon{
  font-size:50px;
}

#windowText{
  font-size:17px;
}

#windowHint{
  font-size:12px;
  opacity:.55;
}

#info{
  font-size:12px;
  opacity:.55;
  margin:7px;
}
</style>
</head>

<body>

<h1>GESTURE OS V8</h1>

<div id="status">
AI SPATIAL INTERFACE • FLOATING WINDOWS
</div>

<div id="gesture">
Show your hand ✋
</div>

<div id="action">
Starting...
</div>

<div id="controls">

Sensitivity:
<input
  id="sensitivity"
  type="range"
  min="1"
  max="100"
  value="40">

<span id="sensValue">40</span>%

</div>

<div id="stage">

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="cursor">
    <div id="cursorDot"></div>
  </div>

  <div id="launcher">

    <div id="launcherTitle">
      GESTURE OS
    </div>

    <div id="apps">

      <div class="app">YouTube</div>
      <div class="app">Camera</div>
      <div class="app">Music</div>

      <div class="app">Browser</div>
      <div class="app">Messages</div>
      <div class="app">Settings</div>

    </div>

  </div>

  <div id="window">

    <div id="windowHeader">

      <div id="windowTitle">
        App
      </div>

      <div>
        GESTURE OS
      </div>

    </div>

    <div id="windowBody">

      <div id="windowIcon">
        🚀
      </div>

      <div id="windowText">
        App Window
      </div>

      <div id="windowHint">
        Pinch again to activate • Fist to go back
      </div>

    </div>

  </div>

</div>

<div id="info">
☝️ Move • 🤏 Open • ✋ Home • ✊ Back • ✌️ Workspace
</div>

<script>

const video=
  document.getElementById("camera");

const stage=
  document.getElementById("stage");

const cursor=
  document.getElementById("cursor");

const launcher=
  document.getElementById("launcher");

const windowBox=
  document.getElementById("window");

const windowTitle=
  document.getElementById("windowTitle");

const windowIcon=
  document.getElementById("windowIcon");

const windowText=
  document.getElementById("windowText");

const gestureText=
  document.getElementById("gesture");

const actionText=
  document.getElementById("action");

const sensitivity=
  document.getElementById("sensitivity");

const sensValue=
  document.getElementById("sensValue");

const apps=[
  ...document.querySelectorAll(".app")
];

let selected=0;

let currentGesture="";
let pinchLocked=false;

let smoothX=.5;
let smoothY=.5;

let appOpen=false;

let lastAction=0;


/* App icons */

const icons={
  YouTube:"▶️",
  Camera:"📷",
  Music:"🎵",
  Browser:"🌐",
  Messages:"💬",
  Settings:"⚙️"
};


/* Sensitivity */

sensitivity.oninput=()=>{

  sensValue.innerText=
    sensitivity.value;

};


/* Distance */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* Gesture recognition */

function recognize(h){

  const s=
    Number(sensitivity.value);

  const pinchLimit=
    .035+(s/100)*.035;

  const pinch=
    distance(h[4],h[8])
    <pinchLimit;


  /*
    PINCH ALWAYS FIRST
  */

  if(pinch)
    return"PINCH";


  const index=
    h[8].y<h[6].y;

  const middle=
    h[12].y<h[10].y;

  const ring=
    h[16].y<h[14].y;

  const pinky=
    h[20].y<h[18].y;


  if(
    index&&
    middle&&
    ring&&
    pinky
  )
    return"PALM";


  if(
    !index&&
    !middle&&
    !ring&&
    !pinky
  )
    return"FIST";


  if(
    index&&
    middle&&
    !ring&&
    !pinky
  )
    return"TWO";


  if(
    index&&
    !middle&&
    !ring&&
    !pinky
  )
    return"POINT";


  return"HAND";
}


/* Highlight app */

function highlight(){

  apps.forEach(
    (app,i)=>{

      app.classList.toggle(
        "selected",
        i===selected
      );

    }
  );

}


/* Open floating window */

function openApp(){

  const name=
    apps[selected].innerText;

  launcher.style.display="none";

  windowBox.style.display="block";

  windowTitle.innerText=name;

  windowText.innerText=
    name+" Window";

  windowIcon.innerText=
    icons[name] || "🚀";

  actionText.innerText=
    "🤏 OPENED → "+name;

  appOpen=true;

}


/* Close window */

function closeApp(){

  windowBox.style.display="none";

  launcher.style.display="block";

  appOpen=false;

  actionText.innerText=
    "✋ HOME";

}


/* Virtual cursor */

function moveCursor(hand){

  const targetX=
    1-hand[8].x;

  const targetY=
    hand[8].y;

  const s=
    Number(sensitivity.value);

  const smoothing=
    .18+(s/100)*.22;


  smoothX+=
    (targetX-smoothX)*
    smoothing;

  smoothY+=
    (targetY-smoothY)*
    smoothing;


  cursor.style.display=
    "block";


  cursor.style.left=
    (smoothX*100)+"%";

  cursor.style.top=
    (smoothY*100)+"%";


  /*
    Don't change launcher
    selection while an app is open.
  */

  if(appOpen)
    return;


  const column=
    Math.min(
      2,
      Math.max(
        0,
        Math.floor(smoothX*3)
      )
    );


  const row=
    Math.min(
      1,
      Math.max(
        0,
        Math.floor(smoothY*2)
      )
    );


  const newSelected=
    row*3+column;


  if(newSelected!==selected){

    selected=
      newSelected;

    highlight();

    actionText.innerText=
      "☝️ "+
      apps[selected].innerText;

  }

}


/* Execute gesture */

function executeGesture(
  gesture,
  hand
){

  const now=
    Date.now();

  const s=
    Number(sensitivity.value);


  /*
    PINCH LOCK
  */

  if(gesture==="PINCH"){

    if(!pinchLocked){

      pinchLocked=true;

      openApp();

      lastAction=now;
    }

    currentGesture="PINCH";

    return;
  }


  /*
    Release pinch only
    after fingers separate.
  */

  if(pinchLocked){

    const d=
      distance(
        hand[4],
        hand[8]
      );

    const releaseLimit=
      .055+(s/100)*.035;

    if(d>releaseLimit){

      pinchLocked=false;

      currentGesture="";

    }

    return;
  }


  /*
    POINT
  */

  if(gesture==="POINT"){

    moveCursor(hand);

    currentGesture=
      "POINT";

    return;
  }


  /*
    HOME
  */

  if(gesture==="PALM"){

    if(
      now-lastAction>500
    ){

      closeApp();

      cursor.style.display=
        "none";

      lastAction=now;

    }

    return;
  }


  /*
    BACK
  */

  if(gesture==="FIST"){

    if(
      now-lastAction>500
    ){

      if(appOpen){

        closeApp();

      }else{

        actionText.innerText=
          "✊ BACK";

      }

      lastAction=now;

    }

    return;
  }


  /*
    WORKSPACE
  */

  if(gesture==="TWO"){

    if(
      now-lastAction>700
    ){

      actionText.innerText=
        "✌️ SWITCH WORKSPACE";

      lastAction=now;

    }

    return;
  }

}


/* MediaPipe */

const hands=
  new Hands({

    locateFile:file=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:1,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


hands.onResults(results=>{

  if(
    !results.multiHandLandmarks ||
    !results.multiHandLandmarks.length
  ){

    gestureText.innerText=
      "Show your hand ✋";

    cursor.style.display=
      "none";

    pinchLocked=false;

    currentGesture="";

    return;
  }


  const hand=
    results.multiHandLandmarks[0];


  const gesture=
    recognize(hand);


  const names={

    POINT:"☝️ POINT",

    PINCH:"🤏 PINCH",

    PALM:"✋ OPEN PALM",

    FIST:"✊ FIST",

    TWO:"✌️ TWO FINGERS",

    HAND:"✋ HAND"

  };


  gestureText.innerText=
    names[gesture];


  executeGesture(
    gesture,
    hand
  );

});


/* Start camera */

async function start(){

  try{

    const stream=
      await navigator.mediaDevices
      .getUserMedia({

        video:true,
        audio:false

      });


    video.srcObject=
      stream;


    const camera=
      new Camera(
        video,
        {

          onFrame:async()=>{

            await hands.send({
              image:video
            });

          },

          width:640,
          height:480

        }
      );


    camera.start();


    actionText.innerText=
      "Gesture OS V8 ready 🚀";


  }catch(error){

    actionText.innerText=
      "Camera error: "+
      error.message;

  }

}


highlight();

start();

</script>

</body>
</html>
